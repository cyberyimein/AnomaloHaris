[project]
name = "anomalo"
version = "0.1.0"
description = "Personal FastAPI AI agent host with OpenRouter, tools, skills, MCP, and streaming chat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.59.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.12",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]

dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.setuptools.packages.find]
include = ["app*"]
