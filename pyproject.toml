[project]
name = "anomalo"
version = "0.1.0"
description = "Personal FastAPI AI agent host with OpenRouter, tools, skills, MCP, and streaming chat."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.59.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.12",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]

audio = [
  "faster-whisper>=1.1.0",
  "kokoro>=0.7.4; python_version < '3.13'",
  "misaki[zh]>=0.7.4; python_version < '3.13'",
  "numpy>=1.26.0; python_version < '3.13'",
  "piper-plus>=0.4.0",
  "soundfile>=0.12.1",
]

buddy = [
  "pyserial>=3.5",
]

vision = [
  "mediapipe>=0.10.20",
  "numpy>=1.26.0; python_version < '3.13'",
  "pillow>=10.4.0",
]

dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["agent-backend", "buddy-backend"]
testpaths = ["agent-backend/tests", "buddy-backend/tests"]

[tool.setuptools.packages.find]
where = ["agent-backend", "buddy-backend"]
include = ["app*", "buddy_backend*"]
