opend:
  host: "127.0.0.1"
  port: 11111
  sdk_home: "data/cache/futu_home"
  websocket_port: null
  private_key_path: null
  cert_path: null
  auth_key: null

workflow:
  market_timezone: "America/New_York"
  data_mode: "opend"
  output_dir: "outputs"
  report_json: "report.json"
  market_context_json: "market_context.json"
  report_markdown: "report.md"
  dev_report_markdown: "dev_report.md"
  archive_live_scans: true
  archive_dir: "data/scan_history"
  history_days: 260
  option_expiries: 2

analysis:
  risk_proxy_symbols:
    - "US.SPY"
    - "US.QQQ"
    - "US.IWM"
    - "US.VIXY"
    - "US.TLT"
    - "US.UUP"
    - "US.GLD"
    - "US.USO"
    - "US.SOXX"
    - "US.IGV"
  market_context:
    equity_symbols:
      - "US.SPY"
      - "US.QQQ"
      - "US.IWM"
    volatility_symbols:
      - "US.VIXY"
    macro_symbols:
      - "US.TLT"
      - "US.UUP"
      - "US.GLD"
      - "US.USO"
    sector_symbols:
      - "US.SOXX"
      - "US.IGV"
    leadership_groups:
      semiconductors:
        label: "半导体领导力"
        proxy_for: "SOX"
        symbols:
          - "US.SOXX"
      software:
        label: "软件领导力"
        symbols:
          - "US.IGV"
    sector_breadth_symbols: []
  attention_thresholds:
    watch: 70
    observe: 45
