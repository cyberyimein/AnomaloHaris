# Optional plugin allowlist. Set ANOMALOHARIS_PI_EXTENSIONS_ENABLED=true to load it.
plugins:
  - id: buddy-bridge
    version: 1.0.0
    compatibility: L2
    enabled: true
    trust: local-code
    capabilities: [buddy]
    environment: [ANOMALOHARIS_BUDDY_SERVICE_URL, ANOMALOHARIS_BUDDY_SERVICE_TOKEN, ANOMALOHARIS_BUDDY_REQUEST_TIMEOUT_MS]
